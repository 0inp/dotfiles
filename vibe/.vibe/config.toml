theme = "catppuccin-mocha"
default_agent = "ask"
skill_paths = [
    "/Users/oinp/.claude/skills",
]
applied_migrations = [
    "bash_read_only_defaults_v1",
]
active_model = "mistral-large"
connectors = [
    { name = "github_app", disabled = false },
]

[tools.bash]
allowlist = [
    "awk",
    "base64",
    "basename",
    "cat",
    "cd",
    "comm",
    "cut",
    "date",
    "df",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "fmt",
    "fold",
    "grep",
    "head",
    "join",
    "jq",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sed",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "wc",
    "which",
    "git branch",
    "git config --get",
    "git config --get-all",
    "git diff",
    "git fetch",
    "git grep",
    "git log",
    "git ls-files",
    "git ls-remote",
    "git ls-tree",
    "git merge-base",
    "git remote -v",
    "git rev-parse",
    "git show",
    "git show-branch",
    "git status",
    "gh --version",
    "gh auth status",
    "gh pr diff",
    "gh pr list",
    "gh pr view",
    "aws --version",
    "aws cloudtrail lookup-events",
    "aws ec2 describe-instance-attribute",
    "aws ec2 describe-instances",
    "aws ec2 describe-security-groups",
    "aws ec2 get-console-output",
    "aws logs describe-log-groups",
    "aws logs describe-log-streams",
    "aws ssm describe-instance-information",
    "mise",
    "npm test",
    "ruff",
]

[tools.read_file]
allowlist = [
    "/Users/oinp/.vibe/plans/*",
    "/Users/oinp/dotfiles/vibe/.vibe/plans/*",
    "/private/var/folders/55/x5ssy4ps1vj7n5z4_3w4n1cr0000gn/T/vibe-scratchpad-4dddfe6f-inx13u5w/*",
]

[tools.web_fetch]
allowlist = [
    "api.github.com",
    "github.com",
    "linear.app",
]


[tools.web_search]
permission = "always"

[tools.edit]
allowlist = [
    "/Users/oinp/dev/sillant/sillant-context/repos/table/*",
]

[tools.write_file]
allowlist = [
    "/Users/oinp/dotfiles/vibe/.vibe/plans/*",
    "/private/tmp/*",
]

[tools.connector_github_app_pull_request_read]
permission = "always"

[tools.connector_github_app_get_file_contents]
permission = "always"

[tools.connector_github_app_search_pull_requests]
permission = "always"

[tools.connector_github_app_list_pull_requests]
permission = "always"

[tools.connector_github_app_list_commits]
permission = "always"

[tools.connector_github_app_search_repositories]
permission = "always"

[[models]]
name = "mistral-large-latest"
provider = "mistral"
alias = "mistral-large"
thinking = "off"

[[models]]
name = "mistral-medium-3.5"
provider = "mistral"
alias = "mistral-medium"
thinking = "off"
