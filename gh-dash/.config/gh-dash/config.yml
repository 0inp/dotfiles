prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: All PRs
    filters: is:open org:Sillant
    limit: 60
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention
repoPaths:
  Sillant/*: /Users/oinp/dev/sillant/*
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: false
    width: 70
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
        hidden: true
      author:
        width: 15
        hidden: true
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: g
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  prs:
    - key: C
      name: address my pr comments
      command: >
        mux-new-window "PR-{{.PrNumber}}-comments"
        'BRANCH=$(cd "{{.RepoPath}}" && gh pr view {{.PrNumber}} --json headRefName --jq ".headRefName") && PRE=$(git -C "{{.RepoPath}}" worktree list | grep -c "\[$BRANCH\]") ; wt -C "{{.RepoPath}}" switch pr:{{.PrNumber}} -x claude -- "Traite les commentaires de la PR #{{.PrNumber}} en utilisant la commande pr-comments de sillant-context." ; if [ "${PRE:-0}" -gt 0 ] ; then echo "ℹ️  Worktree pre-existing, left untouched" ; elif wt -C "{{.RepoPath}}" remove "$BRANCH" --no-delete-branch ; then echo "✅ Worktree removed, branch kept" ; else echo "⚠️  Worktree kept: uncommitted work above" ; fi ; printf "Press Enter to close...\n" ; read'
    - key: R
      name: pr-review + cleanup
      command: >
        mux-new-window "PR-{{.PrNumber}}"
        'PR=$(cd "{{.RepoPath}}" && gh pr view {{.PrNumber}} --json headRefName,baseRefName) && BRANCH=$(echo "$PR" | jq -r .headRefName) && BASE=$(echo "$PR" | jq -r .baseRefName) && wt -C "{{.RepoPath}}" switch pr:{{.PrNumber}} -x claude -- "Fais la review de la PR #{{.PrNumber}} ($BRANCH vers $BASE) en utilisant la commande pr-review de sillant-context." ; wt -C "{{.RepoPath}}" remove "$BRANCH" --force-delete --force 2>/dev/null ; echo "✅ Worktree for $BRANCH removed" ; printf "Press Enter to close...\n" ; read'
    - key: E
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}

theme:
  # Catppuccin Mocha, as in catppuccin/gh-dash.
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#89b4fa"
      inverted: "#11111b"
      faint: "#bac2de"
      warning: "#f9e2af"
      success: "#a6e3a1"
      error: "#f38ba8"
    background:
      selected: "#313244"
    border:
      primary: "#89b4fa"
      secondary: "#45475a"
      faint: "#313244"
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: true
pager:
  diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
